<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Student - Letter of Recommendation DApp</title>
  <link rel="stylesheet" href="../frontend/src/index.css">
  <style> body { padding-top: 20px; } </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-section">
        <div class="logo-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
        </div>
        <div class="logo-text">
          <h1>Letter of Recommendation DApp</h1>
          <p>Decentralized LoR Verification on Ethereum & Sepolia</p>
        </div>
      </div>
      <div class="wallet-section">
        <div class="network-badge"><span class="network-dot"></span><span>Sepolia Testnet</span></div>
        <div class="account-pill mono"><span>0x71C8...A329</span></div>
      </div>
    </header>

    <nav class="tabs-container">
      <button class="tab-btn">All Students (3)</button>
      <button class="tab-btn active">Add Student</button>
      <button class="tab-btn">Request LoR</button>
      <button class="tab-btn">Approve LoR</button>
      <button class="tab-btn">Approver Management</button>
    </nav>

    <section class="card" style="max-width: 600px; margin: 0 auto;">
      <h2 class="card-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
        Add New Student
      </h2>
      <p class="card-desc">
        Register student information onto the smart contract to enable LoR requests and verification.
      </p>

      <form>
        <div class="form-group">
          <label class="form-label">Student Full Name</label>
          <input type="text" class="form-input" value="Sriharsha Reddy" />
        </div>

        <div class="form-group">
          <label class="form-label">Course / Specialization</label>
          <input type="text" class="form-input" value="Master of Science in Web3 & Distributed Systems" />
        </div>

        <div class="form-group">
          <label class="form-label">Student Email</label>
          <input type="email" class="form-input" value="sriharsha@university.edu" />
        </div>

        <button type="button" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Register Student On-Chain
        </button>
      </form>
    </section>
  </div>
</body>
</html>
