<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Approve LoR - Letter of Recommendation DApp</title>
  <link rel="stylesheet" href="../frontend/src/index.css">
  <style> body { padding-top: 20px; } </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-section">
        <div class="logo-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
        </div>
        <div class="logo-text">
          <h1>Letter of Recommendation DApp</h1>
          <p>Decentralized LoR Verification on Ethereum & Sepolia</p>
        </div>
      </div>
      <div class="wallet-section">
        <div class="network-badge"><span class="network-dot"></span><span>Sepolia Testnet</span></div>
        <div class="account-pill mono"><span>0x71C8...A329</span></div>
      </div>
    </header>

    <nav class="tabs-container">
      <button class="tab-btn">All Students (3)</button>
      <button class="tab-btn">Add Student</button>
      <button class="tab-btn">Request LoR</button>
      <button class="tab-btn active">Approve LoR (Faculty Mode)</button>
      <button class="tab-btn">Approver Management</button>
    </nav>

    <section class="card" style="max-width: 650px; margin: 0 auto;">
      <h2 class="card-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
        Approve Letter of Recommendation
      </h2>
      <p class="card-desc">
        Faculty approvers review pending requests and approve recommendations with optional IPFS document links.
      </p>

      <form>
        <div class="form-group">
          <label class="form-label">Select Pending Student Request</label>
          <select class="form-select">
            <option>#2 - Alex Rivers (Blockchain Architecture & Cryptography)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Student ID</label>
          <input type="number" class="form-input mono" value="2" />
        </div>

        <div class="form-group">
          <label class="form-label">Recommendation Remarks / LoR Text (Bonus)</label>
          <textarea rows="3" class="form-textarea">I enthusiastically recommend Alex Rivers for advanced research. Alex consistently demonstrated deep technical acumen in EVM architecture, zero-knowledge proofs, and smart contract security.</textarea>
        </div>

        <div class="form-group">
          <label class="form-label">IPFS CID / Document Link (Bonus Optional)</label>
          <input type="text" class="form-input mono" value="ipfs://QmXoypizjW3WknFiJnKLwHCnL72vedxjQkDDP1mXWo6uco" />
        </div>

        <button type="button" class="btn btn-success" style="width: 100%; margin-top: 1rem;">
          Approve & Issue LoR On-Chain
        </button>
      </form>
    </section>
  </div>
</body>
</html>
